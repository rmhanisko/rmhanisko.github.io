<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tap That Promotion Redemption</title>
  <style>
    :root {
      --purple: #6d3aa8;
      --purple-dark: #4e247f;
      --green: #168a45;
      --red: #b42318;
      --amber: #b26a00;
      --gray: #666;
      --light: #f7f4fb;
      --border: #ded7e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: #222;
    }
    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 20px 16px 36px;
    }
    .brand { text-align: center; margin-bottom: 16px; }
    .brand img { max-width: 220px; width: 70%; height: auto; }
    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--purple);
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: 36px; line-height: 1.05; }
    .message {
      margin: 0 auto 20px;
      max-width: 420px;
      font-size: 18px;
      line-height: 1.4;
    }
    .details {
      margin: 20px 0;
      padding: 16px;
      background: #faf9fc;
      border-radius: 12px;
      text-align: left;
    }
    .detail-row {
      margin: 8px 0;
      font-size: 16px;
      line-height: 1.35;
      word-break: break-word;
    }
    .detail-label { font-weight: 700; }
    button {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }
    #redeemButton { background: var(--purple); color: white; }
    #redeemButton:hover { background: var(--purple-dark); }
    #redeemButton:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-valid h1 { color: var(--green); }
    .status-redeemed h1, .status-already_redeemed h1 { color: var(--red); }
    .status-expired h1 { color: var(--amber); }
    .status-invalid h1, .status-error h1 { color: var(--red); }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 8px auto 18px;
      border: 5px solid #e9e1f2;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--gray);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
      <img src="TapThatLogo.png" alt="Tap That" />
    </div>

    <section id="card" class="card">
      <p class="eyebrow">Promotion Redemption</p>

      <div id="loadingState">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Checking...</h1>
        <p class="message">Validating this promotion.</p>
      </div>

      <div id="resultState" class="hidden">
        <h1 id="statusTitle"></h1>
        <p id="statusMessage" class="message"></p>

        <div id="promotionDetails" class="details hidden">
          <div class="detail-row">
            <span class="detail-label">Business:</span>
            <span id="businessName"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Promotion:</span>
            <span id="campaignName"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Code:</span>
            <span id="promotionCode"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Expires:</span>
            <span id="expiresAt"></span>
          </div>
          <div id="redeemedRow" class="detail-row hidden">
            <span class="detail-label">Redeemed:</span>
            <span id="redeemedAt"></span>
          </div>
        </div>

        <button id="redeemButton" class="hidden" type="button">REDEEM PROMOTION</button>
      </div>
    </section>

    <div class="footer">Tap That • Single Use Digital Promotion</div>
  </main>

  <script>
    const REDEEM_ENDPOINT =
      "https://cavvmywysmuzezuobbow.supabase.co/functions/v1/redeem-promotion";

    const params = new URLSearchParams(window.location.search);
    const code = (params.get("code") || "").trim().toUpperCase();

    const card = document.getElementById("card");
    const loadingState = document.getElementById("loadingState");
    const resultState = document.getElementById("resultState");
    const statusTitle = document.getElementById("statusTitle");
    const statusMessage = document.getElementById("statusMessage");
    const promotionDetails = document.getElementById("promotionDetails");
    const businessName = document.getElementById("businessName");
    const campaignName = document.getElementById("campaignName");
    const promotionCode = document.getElementById("promotionCode");
    const expiresAt = document.getElementById("expiresAt");
    const redeemedRow = document.getElementById("redeemedRow");
    const redeemedAt = document.getElementById("redeemedAt");
    const redeemButton = document.getElementById("redeemButton");

    function formatDateTime(value) {
      if (!value) return "";
      const date = new Date(value);
      return new Intl.DateTimeFormat("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }).format(date);
    }

    function showResult(result, data) {
      loadingState.classList.add("hidden");
      resultState.classList.remove("hidden");
      redeemButton.classList.add("hidden");
      promotionDetails.classList.add("hidden");
      redeemedRow.classList.add("hidden");

      card.className = "card status-" + result;

      const promotion = data && data.promotion;

      if (promotion) {
        promotionDetails.classList.remove("hidden");
        businessName.textContent = promotion.business_name || "";
        campaignName.textContent = promotion.campaign_name || "";
        promotionCode.textContent = promotion.promotion_code || code;
        expiresAt.textContent = promotion.expires_at
          ? formatDateTime(promotion.expires_at)
          : "No expiration date";

        if (promotion.redeemed_at) {
          redeemedRow.classList.remove("hidden");
          redeemedAt.textContent = formatDateTime(promotion.redeemed_at);
        }
      }

      switch (result) {
        case "valid":
          statusTitle.textContent = "VALID";
          statusMessage.textContent = "This promotion is available and may be redeemed.";
          redeemButton.classList.remove("hidden");
          break;
        case "redeemed":
          statusTitle.textContent = "REDEEMED";
          statusMessage.textContent = "Promotion successfully redeemed.";
          break;
        case "already_redeemed":
          statusTitle.textContent = "ALREADY REDEEMED";
          statusMessage.textContent = "This promotion has already been used.";
          break;
        case "expired":
          statusTitle.textContent = "EXPIRED";
          statusMessage.textContent = "This promotion is no longer valid.";
          break;
        case "invalid":
          statusTitle.textContent = "INVALID PROMOTION";
          statusMessage.textContent = data && data.message
            ? data.message
            : "This promotion code was not found.";
          break;
        default:
          statusTitle.textContent = "ERROR";
          statusMessage.textContent = data && data.message
            ? data.message
            : "Unable to verify this promotion.";
      }
    }

    async function callPromotionFunction(action) {
      const response = await fetch(REDEEM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, code })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error((data && (data.message || data.error)) || "Request failed");
      }

      return data;
    }

    async function validatePromotion() {
      if (!code) {
        showResult("invalid", { message: "No promotion code was supplied." });
        return;
      }

      try {
        const data = await callPromotionFunction("validate");
        showResult(data.result, data);
      } catch (error) {
        console.error(error);
        showResult("error", { message: "Unable to validate promotion right now." });
      }
    }

    redeemButton.addEventListener("click", async () => {
      redeemButton.disabled = true;
      redeemButton.textContent = "REDEEMING...";

      try {
        const data = await callPromotionFunction("redeem");
        showResult(data.result, data);
      } catch (error) {
        console.error(error);
        showResult("error", { message: "Unable to redeem promotion right now." });
      } finally {
        redeemButton.disabled = false;
        redeemButton.textContent = "REDEEM PROMOTION";
      }
    });

    validatePromotion();
  </script>
</body>
</html>
