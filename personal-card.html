<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Card</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0}
.container{max-width:900px;margin:auto;padding:40px 20px;text-align:center}
.card{max-width:380px;margin:20px auto}
.card img{width:100%;border-radius:12px}
.info{background:rgba(255,255,255,.06);padding:20px;border-radius:12px;margin-top:20px}
h2{color:#38bdf8}
</style>
</head>
<body>
<div class="container">
<h1>Welcome!</h1>
<div class="card">
<img src="rmh-business-card.png" alt="Business Card">
</div>
<div class="info">
<h2 id="client"></h2>
<p><strong>Business Objective</strong><br><span id="objective"></span></p>
<p id="message"></p>
</div>
</div>
<script>
const params=new URLSearchParams(window.location.search);

const client=params.get('c')||params.get('client')||'Your Business';
const objective=params.get('o')||params.get('objective')||'Use technology to improve daily operations.';
const message=params.get('m')||params.get('message')||'Thank you for connecting with RMH Solutions.';

document.getElementById('client').textContent='Prepared for ' + client;
document.getElementById('objective').textContent=objective;
document.getElementById('message').textContent=message;
</script>
</body>
</html>
