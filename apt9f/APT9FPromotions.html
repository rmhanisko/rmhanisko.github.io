<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Save the current promotion from APT 9F." />
  <title>Promotions | APT 9F</title>
  <style>
    :root {
      --yellow: #ffb81c;
      --navy: #14216a;
      --paper: #fffdf7;
      --ink: #14213c;
      --muted: #5e6473;
      --line: #e4dccb;
      --max-width: 1100px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.55;
    }
    .site-header {
      background: var(--yellow);
      border-bottom: 1px solid rgba(20,33,106,.15);
    }
    .header-inner {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      min-height: 142px;
      display: flex;
      align-items: center;
    }
    .header-inner img {
      display: block;
      width: 220px;
      max-width: 52vw;
      height: auto;
    }
    main {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 36px;
      margin-bottom: 30px;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.02;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .section-heading > p {
      max-width: 430px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }
    .featured-promotion {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .promotion-image {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px rgba(20,33,106,.14);
    }
    .promotion-actions {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
    .promotion-download {
      min-height: 52px;
      padding: 0 28px;
      border: 2px solid var(--navy);
      border-radius: 2px;
      color: #fff;
      background: var(--navy);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .promotion-download:hover,
    .promotion-download:focus-visible {
      color: var(--navy);
      background: var(--yellow);
      outline: none;
    }
    footer {
      background: var(--yellow);
      border-top: 1px solid rgba(20,33,106,.15);
      padding: 32px 0;
    }
    .footer-inner {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .footer-inner img {
      width: 150px;
      height: auto;
    }
    .footer-inner p {
      margin: 0;
      color: var(--navy);
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    @media (max-width: 720px) {
      .section-heading { display: block; }
      .section-heading > p { margin-top: 14px; }
      main { padding: 40px 0 60px; }
      .header-inner { min-height: 110px; }
    }
  </style>
</head>
<body>
  <header class="site-header" aria-label="APT 9F">
    <div class="header-inner">
      <img src="apt9f-logo.png" alt="APT 9F Drinking Den Social Eatery">
    </div>
  </header>

  <main id="promotions">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Current Promotion</p>
        <h1>$2 Off Your Next Visit</h1>
      </div>
      <p>Save this promotion to your phone and present it during your next visit to APT 9F.</p>
    </div>

    <section class="featured-promotion" aria-label="$2 off next visit promotion">
      <img class="promotion-image" src="APT9F-Promotion.png"
           alt="APT 9F promotion offering $2 off your next visit">

      <div class="promotion-actions">
        <button id="savePromotion" class="promotion-download" type="button">
          Save Promotion
        </button>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <img src="apt9f-logo.png" alt="APT 9F">
      <p>Drinking Den · Social Eatery</p>
    </div>
  </footer>

  <script>
  (function () {
    const promotionFile = 'APT9F-Promotion.png';
    const saveButton = document.getElementById('savePromotion');

    async function saveOrSharePromotion() {
      const fileName = 'APT9F-Promotion.png';
      try {
        const response = await fetch(promotionFile);
        if (!response.ok) throw new Error('Unable to load promotion image.');
        const blob = await response.blob();
        const file = new File([blob], fileName, { type: blob.type || 'image/png' });

        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: 'APT 9F Promotion',
            text: 'Save or share this APT 9F promotion.',
            files: [file]
          });
          return;
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        const link = document.createElement('a');
        link.href = promotionFile;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
    }

    saveButton.addEventListener('click', saveOrSharePromotion);
  })();
  </script>
</body>
</html>
