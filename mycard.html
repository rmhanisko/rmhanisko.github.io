<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Card | RMH Solutions LLC</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #0f172a, #020617);
  color: white;
  text-align: center;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 50px 20px;
}

.logo a {
  display: inline-block;
}

.logo img {
  width: 140px;
  margin-bottom: 20px;
  transition: transform 0.2s ease;
}

.logo img:hover {
  transform: scale(1.03);
}

.nav {
  margin-bottom: 35px;
}

.nav a {
  display: inline-block;
  margin: 6px;
  padding: 10px 18px;
  border: 1px solid rgba(56,189,248,0.35);
  border-radius: 999px;
  color: #38bdf8;
  text-decoration: none;
  font-weight: bold;
  background: rgba(255,255,255,0.04);
  transition: 0.2s ease;
}

.nav a:hover {
  background: rgba(56,189,248,0.15);
}

h1 {
  font-size: 48px;
  margin: 20px 0;
}

h1 span {
  color: #38bdf8;
}

p {
  font-size: 18px;
  color: #cbd5f5;
  line-height: 1.6;
}

.section {
  margin-top: 40px;
}

.promotions-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  text-align: center;
}

.box {
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  padding: 32px;
  border-radius: 16px;
  box-sizing: border-box;
  text-align: center;
}

.box p {
  max-width: 680px;
  margin: 0 auto;
}

.box h2 {
  margin: 0 0 14px;
  color: white;
  font-size: 28px;
}

.offer {
  font-size: 22px;
  color: #38bdf8;
  font-weight: bold;
  margin: 14px auto 18px;
}

.coupon-download {
  max-width: 680px;
  margin: 28px auto 0;
  padding: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  border-radius: 14px;
  background: rgba(255,255,255,0.035);
}

.coupon-action,
.coupon-details {
  width: 100%;
  text-align: center;
}


.coupon-button {
  display: inline-block;
  margin-top: 0;
  padding: 14px 26px;
  border-radius: 999px;
  background: #38bdf8;
  color: #020617;
  text-decoration: none;
  font-weight: bold;
  font-size: 16px;
  transition: 0.2s ease;
}

.coupon-button:hover {
  background: #7dd3fc;
}

.coupon-note {
  margin-top: 0;
  font-size: 15px;
  color: #94a3b8;
  text-align: center;
}

.expiration {
  margin-top: 8px;
  font-size: 14px;
  color: #94a3b8;
  text-align: center;
}

.footer-contact {
  margin-top: 50px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 16px;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
}

.footer-contact div {
  padding: 20px;
  font-size: 16px;
  color: #cbd5f5;
  text-align: center;
}

.footer-contact div:not(:last-child) {
  border-right: 1px solid rgba(255,255,255,0.08);
}

.footer-contact a {
  color: #38bdf8;
  text-decoration: none;
}

.footer-contact a:hover {
  text-decoration: underline;
}

footer {
  margin-top: 35px;
  font-size: 14px;
  color: #94a3b8;
}

a {
  color: #38bdf8;
  text-decoration: none;
}

/* FADE-IN ANIMATION */

.fade-in {
  opacity: 0;
  transform: translateY(14px);
  animation: fadeInUp 0.7s ease forwards;
}

.fade-delay-1 {
  animation-delay: 0.1s;
}

.fade-delay-2 {
  animation-delay: 0.2s;
}

.fade-delay-3 {
  animation-delay: 0.3s;
}

.fade-delay-4 {
  animation-delay: 0.4s;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 760px) {

  .container {
    padding: 40px 16px;
  }

  .promotions-grid {
    grid-template-columns: 1fr;
  }

  .box {
    width: 100%;
  }

  .coupon-download {
    padding: 18px;
  }

  .footer-contact {
    grid-template-columns: 1fr;
  }

  .footer-contact div:not(:last-child) {
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  h1 {
    font-size: 40px;
  }

  p {
    font-size: 17px;
  }
}


.card-preview {
  max-width: 360px;
  margin: 28px auto 0;
  padding: 12px;
  border-radius: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
}

.card-preview img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 10px;
}

</style>
</head>

  <h1 class="fade-in fade-delay-1">

    <div class="box fade-in fade-delay-3">
      
      <div class="card-preview">

      </div>

      <div class="coupon-download">

          </a>
        </div>

        <div class="coupon-details">
          <div class="coupon-note">
            Tap the button to download the image to your device.
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-contact fade-in fade-delay-4">
    <div>
      🌐
      <a href="https://rmhsolutions.io" target="_blank" rel="noopener">
        rmhsolutions.io
      </a>
    </div>

    <div>
      📧
      <a href="mailto:robert@rmhsolutions.io">
        robert@rmhsolutions.io
      </a>
    </div>

    <div>
      ☎
      <a href="tel:+19543725474">
        954.372.5474
      </a>
    </div>
  </div>

  <footer>
    © 2026 RMH Solutions LLC · All rights reserved
  </footer>

</div>




</body>
</html>
